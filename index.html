<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maangers — задачи команды</title>
<style>
:root{--bg:#0b1020;--card:#141b31;--card2:#1b2440;--text:#eef2ff;--muted:#97a3c5;--accent:#7c5cff;--red:#ff5c7a;--orange:#ffab4c;--green:#3ddc97;--border:#2b365a}*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif;background:linear-gradient(135deg,#0b1020,#111936);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.danger{background:#422033;color:#ff9aac}.app{display:none;max-width:1300px;margin:auto;padding:24px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:rgba(20,27,49,.94);border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 25px 70px #0008}.logo{font-size:28px;font-weight:900}.logo b{color:#9b86ff}.subtitle{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin:15px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1327;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.user{color:var(--muted)}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.side,.content,.modal-box{background:rgba(20,27,49,.94);border:1px solid var(--border);border-radius:18px}.side{padding:14px;height:max-content}.folder{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px;background:transparent;color:var(--text);text-align:left;margin:3px 0}.folder.active{background:#252e51}.folder small{color:var(--muted)}.content{padding:22px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.tasks{display:grid;gap:10px}.task{background:var(--card2);border:1px solid var(--border);padding:15px;border-radius:14px;display:flex;gap:14px;align-items:flex-start}.task.done{opacity:.6}.task.done .task-title{text-decoration:line-through}.check{width:22px;height:22px;accent-color:var(--green);margin-top:2px}.task-main{flex:1}.task-title{font-weight:800;font-size:16px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}.badge{padding:3px 8px;border-radius:20px;background:#263150}.urgent{background:#48213b;color:#ff91ad}.high{background:#483619;color:#ffc570}.normal{background:#243451;color:#a9c8ff}.low{background:#1e443b;color:#8de7c1}.empty{text-align:center;padding:50px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#0009;place-items:center;padding:20px}.modal.show{display:grid}.modal-box{width:min(520px,100%);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin-top:0}.admin-only{display:none}.admin .admin-only{display:block}.error{color:#ff93a7;min-height:20px;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}.side{order:2}.top{align-items:flex-start;flex-direction:column}.task{padding:12px}}
</style></head><body>
<div class="login" id="login"><div class="login-card"><div class="logo">Task<b>Flow</b></div><p class="subtitle">Общее пространство задач команды</p><div class="field"><label>Ваше имя</label><input id="name" placeholder="Например, Иван"></div><div class="field"><label>Telegram ник</label><input id="tg" placeholder="@username"></div><div class="field"><label>Пароль доступа</label><input id="pass" type="password" placeholder="Ваш Telegram ник"></div><button onclick="login()">Войти в задачи</button><div class="error" id="loginError"></div><p class="subtitle" style="font-size:12px;margin-top:18px">Первый вход администратора: @SUBBOY1 / пароль @SUBBOY1</p></div></div>
<div class="app" id="app"><div class="top"><div><div class="logo">Task<b>Flow</b></div><div class="user" id="userInfo"></div></div><div style="display:flex;gap:8px"><button class="ghost admin-only" onclick="openModal('usersModal')">Пользователи</button><button class="ghost" onclick="logout()">Выйти</button></div></div>
<div class="layout"><aside class="side"><button class="admin-only" style="width:100%;margin-bottom:10px" onclick="openFolderModal()">+ Новая папка</button><button class="folder active" onclick="selectFolder('all',this)">📋 Все задачи <small id="allCount"></small></button><div id="folders"></div></aside><main class="content"><div class="toolbar"><div><h2 id="title">Все задачи</h2><div class="subtitle">Отмечайте выполненное — команда увидит прогресс</div></div><button class="admin-only" onclick="openTaskModal()">+ Добавить задачу</button></div><div class="tasks" id="tasks"></div></main></div></div>
<div class="modal" id="taskModal"><div class="modal-box"><div class="modal-head"><h2>Новая задача</h2><button class="ghost" onclick="closeModal('taskModal')">×</button></div><div class="field"><label>Название</label><input id="taskTitle" placeholder="Что нужно сделать?"></div><div class="field"><label>Описание</label><textarea id="taskDesc" placeholder="Детали задачи"></textarea></div><div class="field"><label>Папка</label><select id="taskFolder"></select></div><div class="field"><label>Срочность</label><select id="priority"><option value="urgent">🔴 Срочно</option><option value="high">🟠 Высокая</option><option value="normal" selected>🔵 Обычная</option><option value="low">🟢 Низкая</option></select></div><button onclick="addTask()">Создать задачу</button></div></div>
<div class="modal" id="folderModal"><div class="modal-box"><div class="modal-head"><h2>Новая тематическая папка</h2><button class="ghost" onclick="closeModal('folderModal')">×</button></div><div class="field"><label>Название папки</label><input id="folderName" placeholder="Например, Маркетинг"></div><button onclick="addFolder()">Создать папку</button></div></div>
<div class="modal" id="usersModal"><div class="modal-box"><div class="modal-head"><h2>Доступ пользователей</h2><button class="ghost" onclick="closeModal('usersModal')">×</button></div><p class="subtitle">Добавьте Telegram ник. Он используется как пароль доступа.</p><div style="display:flex;gap:8px"><input id="newUser" placeholder="@username" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1327;color:white"><button onclick="addUser()">Добавить</button></div><div id="usersList" class="tasks" style="margin-top:15px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://fpgxynmunbpnjdxbzevm.supabase.co';
const SUPABASE_KEY='sb_publishable_u2nI1hWjERH2c2tvD45U9A_c4iW3j6T';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN='@SUBBOY1'; let state={users:[],folders:[],tasks:[]},currentUser=null,currentFolder='all';
const admin=()=>currentUser?.telegram===ADMIN;
async function loadData(){const [u,f,t]=await Promise.all([db.from('users').select('*').eq('allowed',true),db.from('folders').select('*').order('created_at'),db.from('tasks').select('*').order('created_at',{ascending:false})]);if(u.error||f.error||t.error)throw Error((u.error||f.error||t.error).message);state={users:u.data,folders:f.data,tasks:t.data}}
async function login(){try{await loadData();let name=document.getElementById('name').value.trim(),tg=document.getElementById('tg').value.trim(),pass=document.getElementById('pass').value.trim();if(!tg.startsWith('@'))tg='@'+tg;if(!name||!tg)return err('Введите имя и Telegram ник');const allowed=state.users.find(u=>u.telegram.toLowerCase()===tg.toLowerCase());if(!allowed||pass!==tg)return err('Нет доступа. Обратитесь к администратору.');currentUser={name,telegram:tg};sessionStorage.setItem('taskflow_user',JSON.stringify(currentUser));showApp()}catch(e){err('Ошибка подключения: '+e.message)}}
function err(x){document.getElementById('loginError').textContent=x}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('app').classList.toggle('admin',admin());document.getElementById('userInfo').textContent=currentUser.name+' · '+currentUser.telegram+(admin()?' · Главный админ':'');render()}
function logout(){sessionStorage.clear();location.reload()}
async function refresh(){try{await loadData();render()}catch(e){console.error(e)}}
function render(){renderFolders();renderTasks();document.getElementById('allCount').textContent=state.tasks.length;document.getElementById('title').textContent=currentFolder==='all'?'Все задачи':state.folders.find(f=>f.id===currentFolder)?.name||'Задачи'}
function renderFolders(){document.getElementById('folders').innerHTML=state.folders.map(f=>'<button class="folder '+(currentFolder===f.id?'active':'')+'" onclick="selectFolder(\''+f.id+'\')">📁 '+esc(f.name)+' <small>'+state.tasks.filter(t=>t.folder_id===f.id).length+'</small></button>').join('');document.getElementById('taskFolder').innerHTML=state.folders.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')}
function selectFolder(id){currentFolder=id;render()}
function renderTasks(){let list=currentFolder==='all'?state.tasks:state.tasks.filter(t=>t.folder_id===currentFolder);const names={urgent:'Срочно',high:'Высокая',normal:'Обычная',low:'Низкая'};document.getElementById('tasks').innerHTML=list.length?list.slice().sort((a,b)=>a.completed-b.completed).map(t=>'<div class="task '+(t.completed?'done':'')+'"><input class="check" type="checkbox" '+(t.completed?'checked':'')+' onchange="toggleTask(\''+t.id+'\',this.checked)"><div class="task-main"><div class="task-title">'+esc(t.title)+'</div>'+(t.description?'<div class="subtitle" style="margin-top:5px">'+esc(t.description)+'</div>':'')+'<div class="meta"><span class="badge '+t.priority+'">'+names[t.priority]+'</span><span>Создал: '+esc(t.created_by||'—')+'</span>'+(t.completed_by?'<span>✓ Выполнил: '+esc(t.completed_by)+'</span>':'')+'</div></div>'+(admin()?'<button class="danger" onclick="deleteTask(\''+t.id+'\')">Удалить</button>':'')+'</div>').join(''):'<div class="empty">Здесь пока нет задач ✨</div>'}
function openTaskModal(){openModal('taskModal')}
async function addTask(){let title=document.getElementById('taskTitle').value.trim();if(!title)return alert('Введите название');const {error}=await db.from('tasks').insert({title,description:document.getElementById('taskDesc').value.trim(),folder_id:document.getElementById('taskFolder').value,priority:document.getElementById('priority').value,created_by:currentUser.name+' ('+currentUser.telegram+')'});if(error)return alert(error.message);closeModal('taskModal');document.getElementById('taskTitle').value='';document.getElementById('taskDesc').value='';await refresh()}
async function toggleTask(id,completed){const {error}=await db.from('tasks').update({completed,completed_by:completed?currentUser.name+' ('+currentUser.telegram+')':null,completed_at:completed?new Date().toISOString():null}).eq('id',id);if(error)alert(error.message);await refresh()}
async function deleteTask(id){if(!confirm('Удалить задачу?'))return;const {error}=await db.from('tasks').delete().eq('id',id);if(error)alert(error.message);await refresh()}
function openFolderModal(){openModal('folderModal')}
async function addFolder(){let name=document.getElementById('folderName').value.trim();if(!name)return;const {error}=await db.from('folders').insert({name});if(error)return alert(error.message);closeModal('folderModal');document.getElementById('folderName').value='';await refresh()}
function openModal(id){document.getElementById(id).classList.add('show');if(id==='usersModal')renderUsers()}
function closeModal(id){document.getElementById(id).classList.remove('show')}
async function addUser(){let telegram=document.getElementById('newUser').value.trim();if(!telegram)return;if(!telegram.startsWith('@'))telegram='@'+telegram;const {error}=await db.from('users').insert({name:telegram,telegram,allowed:true,is_admin:false});if(error)return alert(error.message);document.getElementById('newUser').value='';await refresh();renderUsers()}
function renderUsers(){document.getElementById('usersList').innerHTML=state.users.map(u=>'<div class="task"><div class="task-main">'+esc(u.telegram)+'</div>'+(u.telegram!==ADMIN?'<button class="danger" onclick="removeUser(\''+u.id+'\')">Удалить</button>':'<span class="badge">Админ</span>')+'</div>').join('')}
async function removeUser(id){if(!confirm('Удалить доступ?'))return;const {error}=await db.from('users').delete().eq('id',id);if(error)alert(error.message);await refresh();renderUsers()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{let saved=sessionStorage.getItem('taskflow_user');if(saved){currentUser=JSON.parse(saved);try{await loadData();if(state.users.some(u=>u.telegram===currentUser.telegram))showApp();else sessionStorage.clear()}catch(e){console.error(e)}}})();
db.channel('taskflow-live').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'folders'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'users'},refresh).subscribe();
</script></body></html>
